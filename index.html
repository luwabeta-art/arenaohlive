const lsGet=k=>{try{return localStorage.getItem(k)||''}catch(e){return ''}},lsSet=(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}};
const retry=async(f,n=3)=>{let r;for(let i=0;i<n;i++){try{r=await f()}catch(e){r={error:{message:String(e.message||e)}}}if(!r.error||!/fetch|network|timeout|load failed/i.test(r.error.message||''))return r;await new Promise(z=>setTimeout(z,500*(i+1)))}return r};

function parseGame(game,raw){const G=GAMES[game];let t=String(raw||'').replace(/[\u200b\s]+/g,' ').trim();
 if(G.srv){const m=t.match(/(\d{6,12})\D+(\d{3,5})/);return m&&G.id.test(m[1])&&G.srv.test(m[2])?{id:m[1],srv:m[2]}:null}
 if(G.id.source.includes('#')){t=t.replace(/＃/g,'#').replace(/\s*#\s*/,'#');return G.id.test(t)?{id:t,srv:null}:null}
 if(game==='Call of Duty Mobile')t=t.replace(/\D/g,'');
 return G.id.test(t)?{id:t,srv:null}:null}

 <button class="${s==='none'?'g':'alt'}" onclick="gameM('${g}')">${s==='none'?'Connect':'Manage'}</button></div>`}).join('')}</div>`}

 ${s==='un'?`<div class="card" style="text-align:center"><div class="mut">Your verification code</div><div style="font-size:24px;font-weight:800;letter-spacing:1px;color:var(--ac);margin:4px 0">ARENA-${esc(a.code)}</div><button class="alt" onclick="copyCode('${esc(a.code)}')">📋 Copy</button></div><div class="notice" style="margin-bottom:10px">1. Add the code to your in-game name or bio. 2. Open your profile and screenshot it. 3. Upload it here. Checking is automatic.</div><button class="g" style="width:100%" onclick="shot('${g}')">📸 Upload screenshot</button><div id="vst" style="margin-top:8px"></div>`:''}

 openM(`<div class="row"><div><div style="font-size:30px">${G.ic}</div><h2 style="margin:0">${esc(g)}</h2></div>${gbadge(s,G)}</div>${form?`<div class="notice" style="margin-bottom:10px">${esc(G.tip)}</div>`:''}${body}<button class="alt" style="width:100%;margin-top:6px" onclick="closeM()">Close</button>`);

 const r=await retry(()=>sb.from('game_accounts').upsert(rows));if(r.error)return r.error;

async function proofImg(u,g,btn){const box=btn.parentNode.nextElementSibling||btn.parentNode.insertAdjacentElement('afterend',document.createElement('div'));if(box.dataset.p){box.innerHTML='';delete box.dataset.p;return}
 const {data,error}=await sb.storage.from('proofs').createSignedUrl(u+'/'+g.replace(/[^A-Za-z0-9]/g,'_'),300);if(error||!data)return toast('No proof image found');box.dataset.p=1;box.innerHTML='<img src="'+esc(data.signedUrl)+'" style="width:100%;border-radius:10px;margin-top:8px">'}

async function shrink(f){const b=await createImageBitmap(f);const k=Math.min(1,1280/Math.max(b.width,b.height));const c=document.createElement('canvas');c.width=Math.round(b.width*k);c.height=Math.round(b.height*k);c.getContext('2d').drawImage(b,0,0,c.width,c.height);return new Promise(r=>c.toBlob(r,'image/jpeg',0.85))}
let tj=null;const PF={};
function loadTess(){return tj||(tj=new Promise((ok,no)=>{if(window.Tesseract)return ok(window.Tesseract);const x=document.createElement('script');x.src='https://cdn.jsdelivr.net/npm/tesseract.js@5.1.0/dist/tesseract.min.js';x.onload=()=>ok(window.Tesseract);x.onerror=()=>{tj=null;no()};document.head.appendChild(x)}))}
const cn=t=>String(t||'').toUpperCase().replace(/[^A-Z0-9]/g,'').replace(/[OILSBZ]/g,c=>({O:'0',I:'1',L:'1',S:'5',B:'8',Z:'2'})[c]);
function approx(h,n){if(!n)return false;const m=n.length>8?2:n.length>=5?1:0;for(let i=0;i+n.length<=h.length;i++){let e=0;for(let j=0;j<n.length&&e<=m;j++)if(h[i+j]!==n[j])e++;if(e<=m)return true}return false}
async function prep(blob,inv){const b=await createImageBitmap(blob),c=document.createElement('canvas');c.width=b.width;c.height=b.height;const x=c.getContext('2d');x.drawImage(b,0,0);
 const d=x.getImageData(0,0,c.width,c.height),p=d.data;for(let i=0;i<p.length;i+=4){let g=.3*p[i]+.59*p[i+1]+.11*p[i+2];g=Math.max(0,Math.min(255,(g-128)*1.5+128));if(inv)g=255-g;p[i]=p[i+1]=p[i+2]=g}x.putImageData(d,0,0);return new Promise(r=>c.toBlob(r,'image/png'))}
async function ocrCheck(blob,a){try{const T=await loadTess(),code=cn('ARENA'+a.code),id=cn(String(a.game_id).split('#')[0]);let txt='';
 for(const inv of [false,true]){const r=await T.recognize(await prep(blob,inv),'eng');txt+=cn(r.data.text);if(approx(txt,code)&&approx(txt,id))break}
 return{ran:true,code:approx(txt,code),id:approx(txt,id)}}catch(e){return{ran:false}}}
const vs=h=>{const e=$('#vst');if(e)e.innerHTML='<div class="notice">'+h+'</div>';else toast(h.replace(/<[^>]+>/g,''))};
function shot(game){const a=acct(game);if(!a)return gameM(game);const i=document.createElement('input');i.type='file';i.accept='image/*';i.onchange=async()=>{const f=i.files[0];if(!f)return;
 try{vs('⏳ Preparing…');PF[game]=await shrink(f);checkAndSend(game,false)}catch(e){vs('❌ Could not read that image. Try another screenshot.')}};i.click()}
async function checkAndSend(game,force){const a=acct(game),blob=PF[game];if(!a||!blob||busy)return;busy=true;
 try{if(!force){vs('🔍 Reading your screenshot…');const c=await ocrCheck(blob,a);
   if(c.ran&&!c.code){return vs('❌ Could not find <b>ARENA-'+esc(a.code)+'</b>. Make sure it is in your in-game name, fully visible and sharp.<div style="display:flex;gap:8px;margin-top:8px"><button class="g" onclick="shot(\''+game+'\')">📸 Try again</button><button class="alt" onclick="checkAndSend(\''+game+'\',true)">Send anyway</button></div>')}
   if(c.ran)vs('✅ Code '+(c.id?'and ID ':'')+'found')}
  vs('⬆️ Uploading…');const path=me.id+'/'+game.replace(/[^A-Za-z0-9]/g,'_');
  const up=await retry(()=>sb.storage.from('proofs').upload(path,blob,{upsert:true,contentType:'image/jpeg'}));if(up.error)return vs('❌ '+esc(up.error.message));
  vs('🤖 Verifying…');let r=await sb.functions.invoke('verify-game',{body:{game}});
  if(r.error&&/fetch|network/i.test(r.error.message||''))r=await sb.functions.invoke('verify-game',{body:{game}});
  const toMod=async m=>{await sb.from('game_accounts').update({requested:true}).eq('user_id',me.id).eq('game',game);toast(m);await refresh();gameM(game)};
  if(r.error||!r.data)return toMod('📨 Sent for review. You will be notified here ✅');
  if(r.data.verified){toast('✅ Verified!');await refresh();return gameM(game)}
  if(r.data.reason&&!force)return toMod('📨 Auto-check unsure. A moderator will confirm ⏳');
  vs('❌ '+esc(r.data.reason||'Could not verify')+'<div style="margin-top:8px"><button class="g" onclick="shot(\''+game+'\')">📸 Try again</button></div>')
 }catch(e){vs('❌ Connection problem. Try again.')}finally{busy=false}}

async function watch(id){const s=D.streams.find(x=>x.id===id);if(!s)return;cur=s;

-- Safe to run more than once. Paste in Supabase > SQL Editor > Run.

alter table dms add column if not exists read_at timestamptz;

create table if not exists team_people(
  team_id text not null,
  user_id uuid not null references auth.users(id) on delete cascade,
  role text not null default 'player' check (role in ('captain','manager','coach','staff','player','sub')),
  status text not null default 'active' check (status in ('active','invited','requested')),
  invited_by uuid,
  created_at timestamptz default now(),
  primary key(team_id,user_id));

create table if not exists team_msgs(
  id bigint generated always as identity primary key,
  team_id text not null,
  sender uuid not null references auth.users(id) on delete cascade,
  body text not null check (char_length(body) between 1 and 1000),
  created_at timestamptz default now());
create index if not exists team_msgs_t on team_msgs(team_id, created_at desc);

create or replace function tp_member(t text) returns boolean language sql security definer stable set search_path=public as $$
  select exists(select 1 from teams where id::text=t and owner=auth.uid())
      or exists(select 1 from team_people where team_id=t and user_id=auth.uid() and status='active') $$;

create or replace function tp_manager(t text) returns boolean language sql security definer stable set search_path=public as $$
  select exists(select 1 from teams where id::text=t and owner=auth.uid())
      or exists(select 1 from team_people where team_id=t and user_id=auth.uid() and status='active' and role in ('captain','manager')) $$;

create or replace function tp_accept(t text) returns void language plpgsql security definer set search_path=public as $$
begin
  update team_people set status='active' where team_id=t and user_id=auth.uid() and status='invited';
  if not found then raise exception 'No invite found'; end if;
end $$;

create or replace function tp_cleanup() returns trigger language plpgsql security definer set search_path=public as $$
begin
  delete from team_people where team_id=old.id::text;
  delete from team_msgs where team_id=old.id::text;
  return old;
end $$;
drop trigger if exists tp_cleanup_t on teams;
create trigger tp_cleanup_t after delete on teams for each row execute function tp_cleanup();

drop policy if exists tp_del on team_people;

drop policy if exists tmsg_sel on team_msgs;

 ${ls&&!self?`<button class="g" style="width:100%;margin-top:8px;background:var(--red);color:#fff" onclick="pfClose();watch('${ls.id}')">🔴 Watch live now</button>`:''}

/* ===== ArenaPH v19: always open fullscreen (browsers require a first tap, so it goes fullscreen on the first touch) ===== */
(function(){
if(window.top!==window.self)return;
try{if(localStorage.getItem('ap_fs')==='0')return}catch(e){}
var d=document,de=d.documentElement,busy=false;
var req=de.requestFullscreen||de.webkitRequestFullscreen||de.mozRequestFullScreen||de.msRequestFullscreen;
if(!req)return;
function isFs(){return !!(d.fullscreenElement||d.webkitFullscreenElement||d.mozFullScreenElement)}
function go(){if(busy||isFs())return;busy=true;
 try{var p=req.call(de,{navigationUI:'hide'});if(p&&p.catch)p.catch(function(){})}catch(e){}
 setTimeout(function(){busy=false;if(!isFs())arm()},600)}
var on=false;
function arm(){if(on)return;on=true;['pointerup','touchend','click','keydown'].forEach(function(t){d.addEventListener(t,fire,{capture:true,passive:true})})}
function fire(){on=false;['pointerup','touchend','click','keydown'].forEach(function(t){d.removeEventListener(t,fire,true)});go()}
/* try right away (works in installed/wrapped apps that allow it), else wait for the first tap */
try{var p0=req.call(de,{navigationUI:'hide'});if(p0&&p0.catch)p0.catch(arm)}catch(e){arm()}
setTimeout(function(){if(!isFs())arm()},300);
/* if the user leaves fullscreen (back gesture, app switch), re-enter on the next tap */
['fullscreenchange','webkitfullscreenchange'].forEach(function(t){d.addEventListener(t,function(){if(!isFs())arm()})});
d.addEventListener('visibilitychange',function(){if(!d.hidden&&!isFs())arm()});
try{screen.orientation&&screen.orientation.unlock&&screen.orientation.unlock()}catch(e){}
})();
</script>

/* ===== Live fix: camera + screen share both work, clear errors, mic fallback, auto-end on Stop sharing ===== */
(function(){
const md=navigator.mediaDevices,canScr=!!(md&&md.getDisplayMedia);
async function camStream(){const v={facingMode:'user',width:{ideal:1280},height:{ideal:720}};
 try{return await md.getUserMedia({video:v,audio:true})}catch(e){return await md.getUserMedia({video:v,audio:false})}}
async function scrStream(){
 const d=await md.getDisplayMedia({video:{frameRate:{ideal:30}},audio:true});
 let mic=null;try{mic=await md.getUserMedia({audio:{echoCancellation:true}})}catch(e){}
 const A=[d,mic].filter(x=>x&&x.getAudioTracks().length);
 if(A.length<2){if(mic&&!d.getAudioTracks().length)mic.getAudioTracks().forEach(t=>d.addTrack(t));return d}
 const AC=window.AudioContext||window.webkitAudioContext,ac=new AC(),dst=ac.createMediaStreamDestination();
 A.forEach(x=>ac.createMediaStreamSource(new MediaStream(x.getAudioTracks())).connect(dst));
 return new MediaStream([...d.getVideoTracks(),...dst.stream.getAudioTracks()])}
window.startCam=async function(screen){
 const f=liveForm();if(!f)return;if(HL)return toast('You are already live');
 if(!md||!window.RTCPeerConnection)return toast('This browser cannot stream. Use Chrome or Safari.');
 if(screen&&!canScr)return toast('Phones cannot share the screen from a browser. Use a computer, or go live with the camera or your YouTube/Facebook link.');
 let st;try{st=screen?await scrStream():await camStream()}
 catch(e){const n=e&&e.name;return toast(screen?(n==='NotAllowedError'?'Screen sharing was cancelled':'Cannot share the screen on this device'):(n==='NotFoundError'?'No camera found on this device':'Allow camera and microphone for this site in your browser settings'))}
 const {data,error}=await insStream(f.title,f.game,'',f.tip,f.links,f.tid);
 if(error){st.getTracks().forEach(t=>t.stop());return toast('\u26a0\ufe0f '+error.message)}
 hostRoom(data,st,!!screen);
 if(screen&&HL){HL.fac='environment';const vt=st.getVideoTracks()[0];if(vt)vt.onended=()=>{if(HL)hostEnd()};
  const c=document.querySelector('#hr').children[2];if(c)c.insertAdjacentHTML('afterbegin','<button class="alt" onclick="hostFlip()">\ud83d\udcf7 Switch to camera</button>')}};
})();
